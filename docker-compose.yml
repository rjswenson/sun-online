version: '3.8'

services:
  elixir:
    build:
      context: .
      dockerfile: Dockerfile.elixir
    ports:
      - "4000:4000"
    environment:
      - MIX_ENV=dev
    volumes:
      - .:/app
    command: mix run --no-halt

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./python:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
