name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Elixir Setup
      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'

      # Python Setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      # Install Dependencies
      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: python

      # Run Unit Tests
      - name: Run Elixir unit tests
        run: mix test --exclude integration

      - name: Run Python tests
        run: pytest -v --cov=app --cov-report=term --cov-report=xml
        working-directory: python

      # Start services for integration tests
      - name: Start Elixir service in background
        run: mix run --no-halt &

      - name: Start Python service in background
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        working-directory: python

      # Wait for services to be ready
      - name: Wait for services to start
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:4000/health > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 2; done'
          echo "✓ Both services are running"

      # Run Integration Tests
      - name: Run Elixir integration tests
        run: mix test --only integration

      # Upload Test Results
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: python/coverage.xml
          flags: python
          name: python-coverage

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: |
            _build/test/
            python/.pytest_cache/
          retention-days: 7
